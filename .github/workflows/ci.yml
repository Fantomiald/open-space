name: Vérification

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm run app:build && npx electron-builder --win --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
